name: build

on:
    push:
        branches: [master]
    pull_request:
        branches: [master]

jobs:
    build:
        uses: consulo/shared-workflows/.github/workflows/build-plugin.yml@master
        with:
            maven-args: -U -T 1C -Dmaven.javadoc.skip=true -B -V -Platest_java clean package
